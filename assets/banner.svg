        values="M0 130 Q300 40 600 130 T1200 130;M0 130 Q300 220 600 130 T1200 130;M0 130 Q300 40 600 130 T1200 130"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 155 Q300 65 600 155 T1200 155">
