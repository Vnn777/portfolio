        values="M0 155 Q300 65 600 155 T1200 155;M0 155 Q300 245 600 155 T1200 155;M0 155 Q300 65 600 155 T1200 155"
        dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g text-anchor="middle" font-family="Arial">
    <text x="600" y="85" fill="white" font-size="38" font-weight="bold">
      Vinicius Cavalcante Costa
    </text>
    <text x="600" y="125" fill="#38BDF8" font-size="23">
      Desenvolvedor de Software | Full Stack
    </text>
    <text x="600" y="158" fill="#CBD5E1" font-size="17">
